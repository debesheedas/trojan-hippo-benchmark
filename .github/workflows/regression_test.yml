name: Regression Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up OpenAI API key
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Create .env file with API key
        echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > .env
        # Verify .env was created (without printing the key)
        if [ -f .env ]; then
          echo "✓ .env file created successfully"
        else
          echo "✗ Failed to create .env file"
          exit 1
        fi
    
    - name: Run regression benchmark (gpt-5-mini)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # CI and ground truth are fixed to gpt-5-mini (see CI-tests/README.md).
        # Run benchmark for all CI testcases; results go to CI-tests/results/gpt-5-mini/
        python scripts/run_benchmark.py \
          --test CI-tests/testcases \
          --memory-backend none explicit mem0 rag context \
          --defense-type none user_prompt_only no_untrusted_tools limit_memory_length provable_policy \
          --results-dir CI-tests/results \
          --model gpt-5-mini \
          --num-workers 1 \
          --force
    
    - name: Compare results with ground truth for test1
      run: |
        python CI-tests/compare_results.py \
          --results-dir CI-tests/results \
          --test-file CI-tests/testcases/test1.json
    
    - name: Compare results with ground truth for test2
      run: |
        python CI-tests/compare_results.py \
          --results-dir CI-tests/results \
          --test-file CI-tests/testcases/test2.json
    
    - name: Compare results with ground truth for test3
      run: |
        python CI-tests/compare_results.py \
          --results-dir CI-tests/results \
          --test-file CI-tests/testcases/test3.json
    
    - name: Clean up test results
      if: always()
      run: |
        # Keep results for debugging, but clean up if needed
        # rm -rf data/benchmark/results/*/regression_test || true
