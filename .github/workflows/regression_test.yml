name: Regression Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up OpenAI API key
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Create .env file with API key
        echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > .env
        # Verify .env was created (without printing the key)
        if [ -f .env ]; then
          echo "✓ .env file created successfully"
        else
          echo "✗ Failed to create .env file"
          exit 1
        fi
    
    - name: Run regression benchmark
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Run benchmark for all combinations of the test file
        # Using --num-workers 1 for serial execution (safer for CI/CD, avoids rate limits)
        # Results will be saved to CI-tests/results/ directory
        python scripts/run_benchmark.py \
          --test CI-tests/testcases/test1.json \
          --memory-backend none explicit mem0 rag context \
          --defense-type none user_prompt_only no_untrusted_tools limit_memory_length provable_policy \
          --results-dir CI-tests/results \
          --num-workers 1 \
          --force
    
    - name: Compare results with ground truth
      run: |
        python CI-tests/compare_results.py \
          --results-dir CI-tests/results \
          --test-file CI-tests/testcases/test1.json
    
    - name: Clean up test results
      if: always()
      run: |
        # Keep results for debugging, but clean up if needed
        # rm -rf data/benchmark/results/*/regression_test || true
