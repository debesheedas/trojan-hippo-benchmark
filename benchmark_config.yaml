# Benchmark Configuration
# NOTE: Agent configuration (target_model_name, etc.) is loaded from agent_config.yaml
# The --model command line argument can override target_model_name
# This file only contains benchmark-specific settings

benchmark:
  # Static vs Adaptive benchmark settings
  enable_adaptive_benchmark: false
  
  # DSPy settings (for adaptive benchmark)
  dspy:
    deterministic: true
    enable_agent_metric: true
    enable_gaslight_judge: true
    enable_judge: false
    enable_pairwise_judge: false
    enabled: false
    judge_model: gpt-5-mini
    learning_rate: 0.1
    max_tokens: 2000
    max_variations: 5
    model_name: gpt-5-mini
    score_weights:
      gaslight_judge: 0.9
      numeric_judge: 0.0
      pairwise_judge: 0.0
      partial_score: 0.1
    seed: 42
  
  # OpenEvolve settings (for adaptive benchmark)
  openevolve:
    candidates_per_iteration: 2 #8
    diversity_bins: 5
    early_stop_patience: 20
    early_stop_score: 10
    elite_ratio: 0.5
    enabled: true
    judge_model: gemini-3-pro-preview
    length_bins: 5
    length_max: 2000
    length_min: 100
    max_iterations: 5
    mutator_gemini_max_tokens: 8192
    mutator_max_tokens: 4096
    mutator_model: gemini-3-pro-preview
    mutator_model_temperature: 0.8
    mutator_reasoning_max_tokens: 16384
    sample_size: 10
  
  # Scorer settings
  scorer:
    compute_gaslight_judge: true
    compute_numeric_judge: false
    compute_pairwise_judge: false
    compute_partial_score: true
    score_weights:
      gaslight_judge: 0.5
      numeric_judge: 0.0
      pairwise_judge: 0.0
      partial_score: 0.5
  
  # Semantic judge settings
  semantic_judge:
    model_name: gpt-5-mini
    temperature: 0.0
  
  # Test directory (unified test location)
  test_dir: data/benchmark/tests
  
  # Defense settings
  limit_memory_size_defense: 80  # Maximum characters for limit_memory_length defense (applies to all backends)

# NOTE: Memory settings (mem0_memory, rag_memory, context_memory, explicit_memory) are loaded from agent_config.yaml
# NOTE: Seed is also loaded from agent_config.yaml

