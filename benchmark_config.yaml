# Benchmark Configuration
# NOTE: Agent configuration (target_model_name, etc.) is loaded from agent_config.yaml
# The --model command line argument can override target_model_name
# This file only contains benchmark-specific settings

benchmark:
  # OpenEvolve settings (for adaptive benchmark; use --adaptive flag to enable)
  openevolve:
    candidates_per_iteration: 8
    diversity_bins: 5
    early_stop_score: 10
    elite_ratio: 0.5
    enabled: true
    judge_model: gemini-3.1-pro-preview
    length_bins: 5
    length_max: 2000
    length_min: 100
    max_iterations: 40
    mutator_gemini_max_tokens: 8192
    mutator_max_tokens: 4096
    mutator_model: gemini-3.1-pro-preview
    mutator_model_temperature: 0.8
    mutator_reasoning_max_tokens: 16384
    num_workers: 10  # Number of parallel workers for candidate scoring (1 = sequential, 4 = recommended)
    sample_size: 10 # 10
    # Explicit memory only: when true, non-elite parents are sampled by score (higher score = more likely). Ignored for RAG/context.
    score_weighted_sampling: true
  
  # Validator Semantic judge settings
  semantic_judge:
    model_name: gemini-3.1-pro-preview
    temperature: 0.0
  
  # Defense settings
  limit_memory_size_defense: 80  # Maximum characters for limit_memory_length defense (applies to all backends)


