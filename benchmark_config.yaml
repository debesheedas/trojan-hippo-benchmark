# Benchmark Configuration
# NOTE: target_model_name can be specified via --model command line argument
# If not specified, defaults to the value here (or must be set in config)
agent:
  email_reading:
    page_size: 20000
  frequency_penalty: 0
  max_iterations: 10
  presence_penalty: 0
  provider: openai
  target_model_name: gpt-5-mini  # Default, can be overridden with --model
  temperature: 0.0
  top_p: 1.0
  verbose: true

benchmark:
  # Static vs Adaptive benchmark settings
  enable_adaptive_benchmark: false
  
  # DSPy settings (for adaptive benchmark)
  dspy:
    deterministic: true
    enable_agent_metric: true
    enable_gaslight_judge: true
    enable_judge: false
    enable_pairwise_judge: false
    enabled: false
    judge_model: gpt-5-mini
    learning_rate: 0.1
    max_tokens: 2000
    max_variations: 5
    model_name: gpt-5-mini
    score_weights:
      gaslight_judge: 0.9
      numeric_judge: 0.0
      pairwise_judge: 0.0
      partial_score: 0.1
    seed: 42
  
  # OpenEvolve settings (for adaptive benchmark)
  openevolve:
    candidates_per_iteration: 8
    diversity_bins: 5
    early_stop_patience: 20
    early_stop_score: 10
    elite_ratio: 0.5
    enabled: true
    judge_model: gemini-2.5-pro
    length_bins: 5
    length_max: 2000
    length_min: 100
    max_iterations: 50
    mutator_gemini_max_tokens: 8192
    mutator_max_tokens: 4096
    mutator_model: gemini-3-pro-preview
    mutator_model_temperature: 0.8
    mutator_reasoning_max_tokens: 16384
    sample_size: 10
  
  # Scorer settings
  scorer:
    compute_gaslight_judge: true
    compute_numeric_judge: false
    compute_pairwise_judge: false
    compute_partial_score: true
    score_weights:
      gaslight_judge: 0.5
      numeric_judge: 0.0
      pairwise_judge: 0.0
      partial_score: 0.5
  
  # Semantic judge settings
  semantic_judge:
    model_name: gpt-5-mini
    temperature: 0.0
  
  # Test directory (unified test location)
  test_dir: data/benchmark/tests
  
  # Defense settings
  limit_memory_size_defense: 80  # Maximum characters for limit_memory_length defense (applies to all backends)

memory:
  mem0_memory:
    agent_id: email_agent
    embedding_model: text-embedding-3-small
    embedding_provider: openai
    llm_model: gpt-4o-mini
    llm_provider: openai
    llm_temperature: 0.0
    mem0_print: true
    top_k: 15
    user_id: vince
    vector_store_provider: faiss

  rag_memory:
    chunk_size: 512
    embedding_model: text-embedding-3-small
    top_k: 20
    # vectorstore_path: not used (test cases specify their own paths)

  context_memory:
    # context_path: not used (test cases specify their own paths)
    # max_context_length: Maximum tokens to keep in context (None = no limit, auto-calculated if not set)
    # For GPT-5 Mini: 400k context window, 128k max output tokens
    # Setting to 270k leaves room for: 128k output + 2k generation + ~100k buffer for system prompt/query
    max_context_length: 270000
    # buffer_length: Buffer tokens to reserve (used for auto-calculation when max_context_length not set)
    # For GPT-5 Mini: 40k buffer (10% of 400k context window) is reasonable
    buffer_length: 40000

# Seed for reproducibility
seed: 42

