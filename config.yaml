# Email Agent Configuration

# LLM Model Configuration
model:
  provider: "openai"  # openai or mock
  model_name: "gpt-4o-mini"
  temperature: 0.7

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000

# Data paths
data:
  mailbox_dir: "data/mailbox"
  drafts_dir: "data/drafts"
  outbox_dir: "data/outbox"
  trace_file: "data/trace.jsonl"

# Recording mode (for future extensibility)
record_mode: false

# Agent Configuration
agent:
  max_iterations: 10  # Maximum tool calls before returning to user
  verbose: true

# Adaptive Benchmark Configuration
adaptive_benchmark:
  enabled: true  # Set to true to enable adaptive attack optimization
  max_optimization_iterations: 20
  success_threshold: 0.7
  cache_successful_attacks: true

# DSPy Optimization Configuration
dspy:
  enabled: true
  model_name: "gpt-4o"
  max_variations: 10
  learning_rate: 0.1
  max_tokens: 2000

# OpenEvolve Optimization Configuration
openevolve:
  enabled: false
  population_size: 10
  mutation_rate: 0.3
  crossover_rate: 0.7
  elite_size: 2
  max_generations: 10

