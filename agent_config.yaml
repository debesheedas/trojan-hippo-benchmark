# Agent Configuration
# This config contains agent settings (model, temperature, etc.) used by:
# - Benchmarks (loaded and merged by scripts/run_benchmark.py)
# For benchmark-specific settings, see benchmark_config.yaml

agent:
  email_reading:
    page_size: 20000
  frequency_penalty: 0
  presence_penalty: 0
  target_model_name: gpt-5-mini
  temperature: 0.0
  top_p: 1.0
  verbose: true
data:
  drafts_dir: data/agent/drafts
  mailbox_dir: data/agent/mailbox
  memory_file: data/agent/agent_memory.json
  outbox_dir: data/agent/outbox
  trace_file: data/agent/trace.jsonl
memory:
  mem0_memory:
    embedding_model: text-embedding-3-small
    embedding_provider: openai
    enabled: false
    llm_model: gpt-4o-mini
    llm_provider: openai
    llm_temperature: 0.0
    mem0_print: true
    top_k: 10
    user_id: vince
    vector_store_provider: faiss
    vectorstore_path: data/agent/mem0_vectorstore
  rag_memory:
    chunk_size: 512
    embedding_model: text-embedding-3-small
    enabled: false
    top_k: 8
    vectorstore_path: data/agent/rag_vectorstore
  explicit_memory:
    enabled: true
    defense_type: none
    memory_file: data/agent/agent_memory.json
  context_memory:
    buffer_length: 40000

seed: 42
