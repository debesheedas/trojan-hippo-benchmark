# Agent Configuration
# This config contains agent settings (model, temperature, etc.) used by both:
# - Interactive agent (via src/interactive_agent/main.py)
# - Benchmarks (loaded and merged by scripts/run_benchmark.py)
# For benchmark-specific settings, see benchmark_config.yaml

agent:
  email_reading:
    page_size: 20000
  frequency_penalty: 0
  presence_penalty: 0
  target_model_name: gpt-5-mini
  temperature: 0.0
  top_p: 1.0
  verbose: true
data:
  drafts_dir: data/interactive_agent/drafts
  mailbox_dir: data/interactive_agent/mailbox
  memory_file: data/interactive_agent/agent_memory.json
  outbox_dir: data/interactive_agent/outbox
  trace_file: data/interactive_agent/trace.jsonl
memory:
  mem0_memory:
    embedding_model: text-embedding-3-small
    embedding_provider: openai
    enabled: false
    llm_model: gpt-4o-mini
    llm_provider: openai
    llm_temperature: 0.0
    mem0_print: true
    top_k: 10
    user_id: vince
    vector_store_provider: faiss
    vectorstore_path: data/interactive_agent/mem0_vectorstore
  rag_memory:
    chunk_size: 512
    embedding_model: text-embedding-3-small
    enabled: false
    top_k: 8
    vectorstore_path: data/interactive_agent/rag_vectorstore
  explicit_memory:
    enabled: true
    defense_type: none
    memory_file: data/interactive_agent/agent_memory.json
  context_memory:
    # max_context_length: Maximum tokens to keep in context (None = no limit, auto-calculated if not set)
    # For GPT-5 Mini: 400k context window, 128k max output tokens
    # Setting to 270k leaves room for: 128k output + 2k generation + ~100k buffer for system prompt/query
    max_context_length: 270000
    # buffer_length: Buffer tokens to reserve (used for auto-calculation when max_context_length not set)
    # For GPT-5 Mini: 40k buffer (10% of 400k context window) is reasonable
    buffer_length: 40000

seed: 42
