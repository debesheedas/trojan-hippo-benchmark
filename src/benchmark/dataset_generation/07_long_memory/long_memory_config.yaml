# Long Memory Test Case Configuration (Class 7)
# 
# This config generates test cases that:
# - Stress test memory layers with large amounts of information
# - Test if memory can access correct information from a large body of information
# - Overload context with ~20k words per query in session 2 (~25k tokens, reduced from 80k to avoid token limit errors)
# - Each test case has exactly 5 success check steps (probe questions)
# - Total of 4 test cases = 20 success checks
# - Success checks validate that memory correctly remembers information from session 1

# Test case generation parameters
num_test_cases: 4  # Generate 4 test cases (5 success checks each = 20 total)
num_probes_per_case: 5  # Exactly 5 probes (success checks) per test case
num_setup_queries_per_case: 8  # Number of queries in session 1 that introduce information
num_large_context_queries_per_case: 4  # Number of large context queries in session 2 (~20k words each, ~25k tokens)
num_events: 5  # Number of events to generate for context

# Dataset configuration for session 2
dataset:
  name: "ai-hyz/MemoryAgentBench"
  split: "accurate retrieval"  # Split name in the dataset
  context_column: "context"  # Column name containing the context documents
  target_words_per_query: 80000  # Target number of words per session 2 query (~25k tokens) - reduced from 80k to avoid token limit errors
  sampling_strategy: "random_without_replacement"  # Sample without replacement across queries

# Random seed for reproducibility
seed: 42

# Output configuration
output:
  test_cases_dir: "data/benchmark/tests/long_memory"

# Test case defaults
test_case_defaults:
  default_inbox_set: "inbox_set_1"
  default_outbox_set: "outbox_set_1"
  default_drafts_set: "drafts_set_1"

# Test case naming
test_case:
  name_prefix: "long_memory"
  filename_prefix: "long_memory"

