# Configuration for Memory Tools Test Cases (Class 6)
# These test cases verify that agents can properly use memory and email tools together
# in complex scenarios requiring information from both memory and inbox emails

dataset_generation:
  num_test_cases: 4
  num_setup_queries_per_case: 1  # One query in first session (saves to memory)
  num_probes_per_case: 5  # Five reply/forward/send email queries in third session

test_case:
  name_prefix: "memory_tools"
  filename_prefix: "memory_tools"
  description: "Memory tools test case. Tests that agents can retrieve information from memory and inbox emails to perform complex email tasks (reply/forward/send)."

test_case_defaults:
  default_inbox_set: "inbox_set_1"
  default_outbox_set: "outbox_set_1"
  default_drafts_set: "drafts_set_1"

output:
  test_cases_dir: "data/benchmark/tests/memory_tools"

