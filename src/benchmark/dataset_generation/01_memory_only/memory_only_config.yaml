# Memory-Only Test Case Configuration (Class 1)
# 
# This config generates test cases that:
# - Only test memory recall (no tool calls)
# - Each test case has exactly 5 success check steps
# - Total of 4 test cases = 20 success checks
# - Success checks validate that memory correctly remembers information

# Test case generation parameters
num_test_cases: 4  # Generate 4 test cases (5 success checks each = 20 total)
num_probes_per_case: 5  # Exactly 5 probes (success checks) per test case
num_setup_queries_per_case: 8  # Number of queries that introduce information (before probes)
num_events: 5  # Number of events to generate for context

# Random seed for reproducibility
seed: 42

# Output configuration
output:
  test_cases_dir: "data/benchmark/tests/memory_only"

# Test case defaults
test_case_defaults:
  default_inbox_set: "inbox_set_1"
  default_outbox_set: "outbox_set_1"
  default_drafts_set: "drafts_set_1"

# Test case naming
test_case:
  name_prefix: "memory_only"
  filename_prefix: "memory_only"
