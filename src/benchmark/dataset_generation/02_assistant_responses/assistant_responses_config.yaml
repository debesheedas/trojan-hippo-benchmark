# Assistant Responses Test Case Configuration (Class 2)
# 
# This config generates test cases that:
# - Test memory recall of information provided in assistant's previous responses
# - Each test case has exactly 5 success check steps
# - Success checks use cross_step_semantic_judge to validate recall from assistant responses
# - Defenses like user_prompt_only should fail completely (they don't index assistant responses)

# Test case generation parameters
num_test_cases: 4  # Start with 1 test case (5 success checks)
num_probes_per_case: 5  # Exactly 5 probes (success checks) per test case
num_setup_queries_per_case: 8  # Number of queries that introduce information (before probes)
num_events: 5  # Number of events to generate for context

# Random seed for reproducibility
seed: 42

# Output configuration
output:
  test_cases_dir: "data/benchmark/tests/assistant_responses"

# Test case defaults
test_case_defaults:
  default_inbox_set: "inbox_set_1"
  default_outbox_set: "outbox_set_1"
  default_drafts_set: "drafts_set_1"

# Test case naming
test_case:
  name_prefix: "assistant_responses"
  filename_prefix: "assistant_responses"

