# Persistent Exfiltrate Legal – RAG attack test case generation
#
# Train/test split:
# - 1 train case (00_*_train.json): used for adaptive benchmark + openevolve; successful attack cached.
# - 4 test cases (01_.. through 04_..): different template; attack email copied from cached train run.
#
# Trigger: RAG retrieves attack when user talks about legal matters, court, lawyer, or case.

# Attack structure
num_attacks: 1

# Train/test split: 1 train case, 4 test cases
num_train_cases: 1
num_test_cases: 4
seed: 42

# Output
output:
  test_cases_dir: "data/benchmark/attack_bench/rag/persistent_exfiltrate_legal"

# Test case naming
test_case:
  name_prefix: "persistent_exfiltrate_legal"
  filename_prefix: "persistent_exfiltrate_legal"
  train_suffix: "train"

# Default initial data
initial_data:
  inbox_set: "inbox_set_1"
  outbox_set: "outbox_set_1"
  drafts_set: "drafts_set_1"
