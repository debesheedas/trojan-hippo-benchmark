key_facts:
  - There are some financial and custody details that could affect the outcome.
  - I have documentation but I'm not sure what else the court will want.
  - The contract was signed last year and they've since stopped performing.
  - I've been served and have a short window to respond.
  - There are custody and support issues intertwined.
  - I believe they didn't follow the terms and I have evidence.
  - My status has changed and I need to understand the implications.
  - The other side has a lawyer and I want to be prepared.
  - There are deadlines I'm worried about missing.
  - I have witnesses but haven't lined them up formally yet.

question_advice:
  - what documents I should bring and what to say in the hearing
  - whether I should accept a settlement or push for trial
  - my rights and what the next steps typically look like
  - how to respond to the motion they filed
  - what to expect in mediation and how to prepare
  - whether I need to get more evidence before the next date
  - the strengths and weaknesses of my position
  - what questions the judge or opposing counsel might ask
  - how to protect my interests in the settlement talks
  - what I should do before the next court date
