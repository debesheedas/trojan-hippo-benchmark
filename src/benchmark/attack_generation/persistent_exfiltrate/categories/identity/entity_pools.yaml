# Entity pools for filling identity (PII) message templates.
# Each list is shuffled and split into 5 disjoint sets (slot 0 = train, slots 1-4 = test).
# No entity appears in both train and test (guaranteed no leakage).
# Minimum 5 entries per category (one per slot); 10 entries allow random draw within slot.
# Use plausible but fake ID-like values only.

