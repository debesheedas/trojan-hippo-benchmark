<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Agent MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr 380px;
            gap: 20px;
            padding: 30px;
        }
        
        .memory-panel {
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        
        .memory-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        
        .memory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .memory-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .connection-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .connection-status.disconnected {
            background: #dc3545;
        }
        
        .memory-section {
            margin-bottom: 20px;
        }
        
        .memory-section-title {
            font-size: 0.9em;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .memory-list {
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85em;
            color: #495057;
        }
        
        .memory-list ul {
            list-style: disc;
            margin-left: 20px;
        }
        
        .memory-list li {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        
        .memory-empty {
            color: #adb5bd;
            font-style: italic;
            font-size: 0.85em;
        }
        
        .memory-actions {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .memory-count {
            font-size: 0.8em;
            color: #6c757d;
        }
        
        .refresh-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 1.2em;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg);
        }
        
        .clear-memory-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 0.8em;
            text-decoration: underline;
        }
        
        .clear-memory-btn:hover {
            color: #c82333;
            transform: none;
        }
        
        .chat-section, .mailbox-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .mailbox-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .email-item {
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #dee2e6;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .email-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .email-header {
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: start;
            background: linear-gradient(to right, #f8f9fa, #fff);
            border-bottom: 1px solid #e9ecef;
        }
        
        .email-header:hover {
            background: linear-gradient(to right, #e9ecef, #f8f9fa);
        }
        
        .email-header-content {
            flex: 1;
        }
        
        .email-subject {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
            font-size: 1.05em;
        }
        
        .email-from {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 3px;
        }
        
        .email-date {
            color: #adb5bd;
            font-size: 0.85em;
        }
        
        .email-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
        }
        
        .badge.unread {
            background: #667eea;
            color: white;
        }
        
        .badge.read {
            background: #e9ecef;
            color: #6c757d;
        }
        
        .expand-icon {
            color: #6c757d;
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }
        
        .email-item.expanded .expand-icon {
            transform: rotate(180deg);
        }
        
        .email-body {
            padding: 0 15px;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .email-item.expanded .email-body {
            max-height: 500px;
            padding: 15px;
        }
        
        .email-body-content {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #495057;
        }
        
        .email-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .email-meta-label {
            font-weight: 600;
            color: #6c757d;
        }
        
        .email-meta-value {
            color: #495057;
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }
        
        .card h2 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .chat-history {
            height: 400px;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #dee2e6;
            margin-bottom: 15px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
        }
        
        .message.agent {
            background: #f0f0f0;
            border-left: 4px solid #764ba2;
        }
        
        .message.tool {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            font-size: 0.9em;
        }
        
        .message-label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #495057;
        }
        
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"], textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .tool-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .trace-log {
            height: 300px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.5;
        }
        
        .trace-event {
            margin-bottom: 10px;
            padding: 8px;
            background: #2d2d2d;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }
        
        .trace-event.tool_call {
            border-left-color: #ffc107;
        }
        
        .trace-event.tool_result {
            border-left-color: #28a745;
        }
        
        .trace-event.user_input {
            border-left-color: #17a2b8;
        }
        
        .trace-event.agent_response {
            border-left-color: #dc3545;
        }
        
        .status-bar {
            padding: 10px 30px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .session-id {
            font-family: 'Courier New', monospace;
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .small-button {
            padding: 6px 12px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Agent MVP</h1>
            <p>AI-powered email assistant with read, search, and draft capabilities</p>
        </div>
        
        <div class="main-content">
            <!-- Left Column: Mailbox -->
            <div class="mailbox-section">
                <div class="card">
                    <h2>📬 Inbox</h2>
                    <div class="mailbox-list" id="mailboxList">
                        <p style="text-align: center; color: #6c757d; padding: 20px;">Loading emails...</p>
                    </div>
                </div>
            </div>
            
            <!-- Middle Column: Chat Interface -->
            <div class="chat-section">
                <div class="card">
                    <h2>💬 Chat with Agent</h2>
                    <div class="chat-history" id="chatHistory"></div>
                    <div class="input-group">
                        <input type="text" id="chatInput" placeholder="Ask the agent to help with your emails..." onkeypress="handleChatKeypress(event)">
                        <button onclick="sendMessage()" id="sendButton">Send</button>
                    </div>
                </div>
                
                <div class="card">
                    <h2>📊 Trace Log</h2>
                    <div class="trace-log" id="traceLog"></div>
                    <button class="small-button" onclick="refreshTrace()">Refresh Trace</button>
                </div>
            </div>
            
            <!-- Right Column: Memory Panel -->
            <div class="memory-panel">
                <div class="memory-card">
                    <div class="memory-header">
                        <div class="memory-title">
                            🧠 Agent Memory
                            <span class="connection-status" id="memoryStatus"></span>
                        </div>
                        <button class="refresh-btn" onclick="refreshMemory()" title="Refresh memory">↻</button>
                    </div>
                    
                    <div class="memory-section">
                        <div class="memory-section-title">Short-Term (Recent Messages)</div>
                        <div class="memory-list" id="shortTermMemory">
                            <p class="memory-empty">No recent messages</p>
                        </div>
                    </div>
                    
                    <div class="memory-section">
                        <div class="memory-section-title">Long-Term (Persistent Facts)</div>
                        <div class="memory-list" id="longTermMemory">
                            <p class="memory-empty">No stored facts</p>
                        </div>
                    </div>
                    
                    <div class="memory-actions">
                        <span class="memory-count" id="memoryCount">0 facts stored</span>
                        <button class="clear-memory-btn" onclick="clearMemory()">Clear Memory</button>
                    </div>
                </div>
            </div>
            
        </div>
        
        <div class="status-bar">
            <div class="session-id">Session: <span id="sessionId"></span></div>
            <div>
                <button class="small-button" onclick="clearChat()">Clear Chat</button>
            </div>
        </div>
    </div>
    
    <script>
        // Generate session ID
        const SESSION_ID = 'session_' + Math.random().toString(36).substr(2, 9);
        document.getElementById('sessionId').textContent = SESSION_ID;
        
        // Add welcome message
        addMessage('agent', 'Welcome! I can help you manage your emails. Try asking me to search for emails, read specific messages, or draft new emails.');
        
        // Load mailbox
        loadMailbox();
        
        // Initialize memory stream
        initializeMemoryStream();
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            // Display user message
            addMessage('user', text);
            input.value = '';
            
            // Disable send button
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            sendButton.textContent = 'Thinking...';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: SESSION_ID, text: text })
                });
                
                const data = await response.json();
                addMessage('agent', data.response);
                
                // Refresh trace
                refreshTrace();
            } catch (error) {
                addMessage('agent', 'Error: ' + error.message);
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        }
        
        function handleChatKeypress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        async function loadMailbox() {
            try {
                const response = await fetch('/api/emails');
                const data = await response.json();
                
                const mailboxList = document.getElementById('mailboxList');
                mailboxList.innerHTML = '';
                
                if (data.emails.length === 0) {
                    mailboxList.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 20px;">No emails in mailbox</p>';
                    return;
                }
                
                data.emails.forEach(email => {
                    const emailDiv = document.createElement('div');
                    emailDiv.className = 'email-item';
                    emailDiv.id = `email-${email.id}`;
                    
                    const readStatus = email.metadata?.read ? 'read' : 'unread';
                    const readBadge = email.metadata?.read 
                        ? '<span class="badge read">Read</span>' 
                        : '<span class="badge unread">New</span>';
                    
                    const date = new Date(email.received_ts);
                    const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    emailDiv.innerHTML = `
                        <div class="email-header" onclick="toggleEmail('${email.id}')">
                            <div class="email-header-content">
                                <div class="email-subject">${email.subject}</div>
                                <div class="email-from">From: ${email.from}</div>
                                <div class="email-date">${formattedDate}</div>
                            </div>
                            <div class="email-status">
                                ${readBadge}
                                <span class="expand-icon">▼</span>
                            </div>
                        </div>
                        <div class="email-body">
                            <div class="email-meta">
                                <div class="email-meta-label">From:</div>
                                <div class="email-meta-value">${email.from}</div>
                                <div class="email-meta-label">To:</div>
                                <div class="email-meta-value">${email.to}</div>
                                <div class="email-meta-label">Subject:</div>
                                <div class="email-meta-value">${email.subject}</div>
                                <div class="email-meta-label">Date:</div>
                                <div class="email-meta-value">${formattedDate}</div>
                            </div>
                            <div class="email-body-content">${email.body_plain}</div>
                        </div>
                    `;
                    
                    mailboxList.appendChild(emailDiv);
                });
            } catch (error) {
                console.error('Error loading mailbox:', error);
                const mailboxList = document.getElementById('mailboxList');
                mailboxList.innerHTML = '<p style="text-align: center; color: #dc3545; padding: 20px;">Error loading emails</p>';
            }
        }
        
        function toggleEmail(emailId) {
            const emailItem = document.getElementById(`email-${emailId}`);
            emailItem.classList.toggle('expanded');
        }
        
        async function refreshTrace() {
            try {
                const response = await fetch(`/api/session/${SESSION_ID}/trace`);
                const data = await response.json();
                
                const traceLog = document.getElementById('traceLog');
                traceLog.innerHTML = '';
                
                data.events.forEach(event => {
                    const eventDiv = document.createElement('div');
                    eventDiv.className = `trace-event ${event.event_type}`;
                    
                    const eventType = event.event_type.toUpperCase().replace('_', ' ');
                    const timestamp = new Date(event.ts).toLocaleTimeString();
                    
                    eventDiv.innerHTML = `
                        <div style="color: #888; font-size: 0.8em;">[${timestamp}] ${eventType}</div>
                        <div>${JSON.stringify(event.payload, null, 2)}</div>
                    `;
                    
                    traceLog.appendChild(eventDiv);
                });
                
                // Scroll to bottom
                traceLog.scrollTop = traceLog.scrollHeight;
            } catch (error) {
                console.error('Error refreshing trace:', error);
            }
        }
        
        function addMessage(type, content) {
            const chatHistory = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = type === 'user' ? 'You' : type === 'agent' ? 'Agent' : 'Tool Output';
            
            messageDiv.innerHTML = `
                <div class="message-label">${label}:</div>
                <div class="message-content">${content}</div>
            `;
            
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        function clearChat() {
            const chatHistory = document.getElementById('chatHistory');
            chatHistory.innerHTML = '';
            addMessage('agent', 'Chat cleared. How can I help you?');
        }
        
        // Auto-refresh trace every 5 seconds when chat is active
        setInterval(() => {
            const chatHistory = document.getElementById('chatHistory');
            if (chatHistory.children.length > 1) {
                refreshTrace();
            }
        }, 5000);
        
        // Memory Management Functions
        let memoryEventSource = null;
        
        function initializeMemoryStream() {
            // Close existing connection if any
            if (memoryEventSource) {
                memoryEventSource.close();
            }
            
            // Establish SSE connection
            memoryEventSource = new EventSource('/memory/stream');
            
            memoryEventSource.onopen = () => {
                console.log('Memory stream connected');
                const statusIndicator = document.getElementById('memoryStatus');
                statusIndicator.classList.remove('disconnected');
            };
            
            memoryEventSource.onmessage = (event) => {
                try {
                    const memory = JSON.parse(event.data);
                    updateMemoryDisplay(memory);
                } catch (error) {
                    console.error('Error parsing memory update:', error);
                }
            };
            
            memoryEventSource.onerror = (error) => {
                console.error('Memory stream error:', error);
                const statusIndicator = document.getElementById('memoryStatus');
                statusIndicator.classList.add('disconnected');
                
                // Attempt to reconnect after 5 seconds
                setTimeout(() => {
                    console.log('Attempting to reconnect memory stream...');
                    initializeMemoryStream();
                }, 5000);
            };
        }
        
        function updateMemoryDisplay(memory) {
            // Update short-term memory
            const shortTermDiv = document.getElementById('shortTermMemory');
            if (memory.short_term && memory.short_term.length > 0) {
                shortTermDiv.innerHTML = '<ul>' + 
                    memory.short_term.map(msg => `<li>${escapeHtml(msg)}</li>`).join('') + 
                    '</ul>';
            } else {
                shortTermDiv.innerHTML = '<p class="memory-empty">No recent messages</p>';
            }
            
            // Update long-term memory
            const longTermDiv = document.getElementById('longTermMemory');
            if (memory.long_term && memory.long_term.length > 0) {
                longTermDiv.innerHTML = '<ul>' + 
                    memory.long_term.map(fact => `<li>${escapeHtml(fact)}</li>`).join('') + 
                    '</ul>';
            } else {
                longTermDiv.innerHTML = '<p class="memory-empty">No stored facts</p>';
            }
            
            // Update count
            const countDiv = document.getElementById('memoryCount');
            const count = memory.long_term ? memory.long_term.length : 0;
            countDiv.textContent = `${count} fact${count !== 1 ? 's' : ''} stored`;
        }
        
        async function refreshMemory() {
            try {
                const response = await fetch('/memory');
                const memory = await response.json();
                updateMemoryDisplay(memory);
            } catch (error) {
                console.error('Error refreshing memory:', error);
            }
        }
        
        async function clearMemory() {
            if (!confirm('Are you sure you want to clear all memory? This cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch('/memory', { method: 'DELETE' });
                if (response.ok) {
                    console.log('Memory cleared successfully');
                } else {
                    console.error('Failed to clear memory');
                    alert('Failed to clear memory');
                }
            } catch (error) {
                console.error('Error clearing memory:', error);
                alert('Error clearing memory: ' + error.message);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (memoryEventSource) {
                memoryEventSource.close();
            }
        });
    </script>
</body>
</html>
